follower_mixed_node:
  ros__parameters:
    # Physical sensor parameters
    camera_fov_deg: 96.0     # C100 camera 4:3
    # camera_fov_deg: 112.0    # C100 camera 16:9
    
    # Logic parameters
    target_distance: 0.30      # Desired distance from the target (m)
    scan_window_deg: 12.0     # Search range around the target direction (degrees)
    lost_timeout: 1.5         # Stop the robot n seconds after the target disappears
    
    # Emergency obstacle avoidance (can be enabled or disabled dynamically or statically)
    enable_safe_stop: false   # Disable emergency obstacle avoidance
    safe_stop_distance: 0.15  # Collision-avoidance distance (m)
    
    # Dynamic limits
    max_linear_x: 0.3         # Maximum linear velocity m/s
    min_linear_x: -0.3        # Maximum reverse velocity m/s
    max_angular_z: 1.5        # Maximum angular velocity rad/s

    # Complete PID controller tuning (based on actual dt)
    # X axis (distance loop)
    kp_x: 0.80
    ki_x: 0.00   # Start at 0; after tuning the PD terms, increase it gradually (for example, 0.05)
    kd_x: 0.05   
    max_integral_x: 0.5 # X-axis integral limit to prevent integral windup

    # Z axis (angle loop)
    kp_z: 1.50
    ki_z: 0.00
    kd_z: 0.50
    max_integral_z: 1.0 # Z-axis integral limit