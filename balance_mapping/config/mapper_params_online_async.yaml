slam_toolbox:
  ros__parameters:

    # 1. Optimizer plugin configuration
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # 2. Core coordinate-frame configuration
    odom_frame: "odom_combined"
    map_frame: "map"
    base_frame: "base_footprint"
    scan_topic: "/scan_fixed"
    mode: "mapping" 

    # 3. Basic parameters
    transform_publish_period: 0.05   # Frequency for publishing the Map->Odom TF
    map_update_interval: 1.5         # Global-map update frequency
    resolution: 0.05                 # Resolution
    min_laser_range: 0.15            # ignore returns off the car's own body (readings were 0.07 m)
    max_laser_range: 8.0            # Allow features to be scanned up to ? meters away
    minimum_time_interval: 0.25       # Maximum number of LiDAR frames processed per second
    transform_timeout: 0.2           # TF TF lookup timeout
    tf_buffer_duration: 30.0         # TF TF cache duration for loop closure and relocalization
    stack_size_to_use: 40000000      # Stack size

    # 4. Scan-matching and keyframe parameters
    use_scan_matching: true          # Whether scan matching is enabled
    use_scan_barycenter: true        # Use the centroid of the LiDAR point cloud as the initial matching position
    minimum_travel_distance: 0.1     # Minimum translation between keyframes (0.25)
    minimum_travel_heading: 0.1      # Minimum rotation between keyframes (radians)) (0.35)
    scan_buffer_size: 10             # Historical scan-buffer size used for scan matching
    scan_buffer_maximum_scan_distance: 10.0  # Maximum scan-matching distance
    link_match_minimum_response_fine: 0.1    # Minimum matching response between keyframes
    link_scan_maximum_distance: 1.5          # Maximum scan-matching distance between keyframes
    
    # 5. Loop-closure parameters (Loop Closure)
    do_loop_closing: true 
    loop_search_maximum_distance: 3.0         # Maximum distance between loop-closure candidate frames
    loop_match_minimum_chain_size: 10         # Minimum chain size for loop-closure matching
    loop_match_maximum_variance_coarse: 3.0   # Maximum distance variance for coarse matching
    loop_match_minimum_response_coarse: 0.35  # Minimum response for coarse matching
    loop_match_minimum_response_fine: 0.45    # Minimum response for fine matching

    # 6. Correlation-search parameters
    correlation_search_space_dimension: 0.5         # Correlation-search-space dimension (meters))
    correlation_search_space_resolution: 0.01       # Correlation-search-space resolution (meters))
    correlation_search_space_smear_deviation: 0.1   # Correlation-search-space blur (meters), used to improve search robustness
    loop_search_space_dimension: 8.0                # Loop-closure search-space dimension (meters), used to limit the distance between candidate frames
    loop_search_space_resolution: 0.05              # Loop-closure search-space resolution (meters), used to improve matching accuracy
    loop_search_space_smear_deviation: 0.03         # Loop-closure search-space blur (meters), used to improve matching robustness

    # 7. Penalty terms
    distance_variance_penalty: 0.5          # Distance-variance penalty
    angle_variance_penalty: 0.8             # Angular-variance penalty
    fine_search_angle_offset: 0.00349       # Angular offset for fine matching (radians))
    coarse_search_angle_offset: 0.349       # Angular offset for coarse matching (radians))
    coarse_angle_resolution: 0.0349         # Angular resolution for coarse matching (radians))
    minimum_angle_penalty: 0.9              # Minimum angular penalty
    minimum_distance_penalty: 0.5           # Minimum distance penalty
    use_response_expansion: true            # Whether response expansion is used to improve matching robustness
