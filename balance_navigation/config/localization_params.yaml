map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom_combined"
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recover_alpha_fast: 0.0
    recover_alpha_slow: 0.0
    scan_topic: /scan
    laser_min_range: 0.15         # ignore returns off the car's own body
    transform_tolerance: 1.0      # Pi 5 + serial odom: allow some TF lag
    update_min_d: 0.05            # update the filter more often than the 0.25 m default
    update_min_a: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    # Nav2 reads the pose as dotted parameters (a list is silently ignored).
    # Step 1 starts SLAM at the start spot, so the start spot is map (0, 0).
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
